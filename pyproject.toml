[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amw-demo"
version = "0.1.0"
description = "Demo client and offline receipt verifier for Agent Middleware (AMW)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
amw-demo = "amw_demo.cli:main"

[tool.setuptools.packages.find]
include = ["amw_demo*"]

[tool.ruff]
target-version = "py310"
line-length = 88
